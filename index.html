<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión del cambio empresarial</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;--bd:color-mix(in srgb,var(--c,#e8a0c0) 55%,#5a3a6a);--tx:color-mix(in srgb,var(--c,#9a5a8a) 25%,#2e2140)}
body{margin:0;height:100%;background:#f8c8dc;color:#2e2140;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{container-type:size;position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:#ffeaf3;display:flex;flex-direction:column;padding:1.6cqw 2cqw;overflow:hidden;box-shadow:0 .8cqw 3cqw rgba(120,40,90,.25);border-radius:1.2cqw}
h1{font-size:4.2cqw;margin:.4cqw 0;text-align:center;color:#6b2a5a}
.sub{font-size:1.9cqw;text-align:center;margin:0 0 1.4cqw;color:#5a3a6a}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6cqw;margin-bottom:1cqw}
.card{background:#fff;border:.35cqw solid var(--bd);border-radius:2cqw;padding:1cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 .5cqw 0 var(--c);cursor:pointer;font:inherit;color:#2e2140;position:relative;transition:transform .15s}
.card:hover,.card:focus-visible{transform:translateY(-.6cqw) rotate(-1.5deg)}
.card .e{font-size:6cqw;animation:fl 3s ease-in-out infinite}
.card b{font-size:2.1cqw;color:var(--tx);margin-top:.8cqw;text-align:center}
.card i{position:absolute;top:.6cqw;right:1cqw;font-style:normal;font-size:2.4cqw;color:var(--tx)}
.foot{font-size:1.5cqw;text-align:center;color:#5a3a6a}
.deco{position:absolute;font-size:3cqw;opacity:.4;animation:fl 4s ease-in-out infinite;pointer-events:none}
.nav{display:flex;gap:.8cqw}
.nav button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:.25cqw solid var(--bd);background:#fff;color:#2e2140;border-radius:99px;padding:.7cqw .6cqw;font:inherit;font-size:1.55cqw;cursor:pointer}
.nav button.on{background:var(--c);font-weight:700}
.bar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:.8cqw;margin:1.2cqw 0}
.chip{border:.25cqw solid var(--bd);background:#fff;color:#2e2140;border-radius:1.4cqw;padding:.7cqw 1.2cqw;font:inherit;font-size:1.7cqw;cursor:pointer;box-shadow:0 .3cqw 0 var(--c);transition:transform .15s}
.chip:hover{transform:translateY(-.3cqw)}
.chip.on{background:var(--c);font-weight:700;transform:translateY(.3cqw);box-shadow:none}
.panel{flex:1;min-height:0;background:#fff;border:.3cqw solid var(--bd);border-radius:2cqw;padding:1.6cqw 2cqw;display:flex;gap:2.4cqw;align-items:center;overflow:auto;animation:pop .3s}
.side{flex:0 0 26%;display:flex;flex-direction:column;align-items:center;gap:1cqw}
.big{width:11cqw;height:11cqw;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:6cqw;box-shadow:0 .5cqw 0 var(--bd);animation:bn 2.5s ease-in-out infinite}
.big:empty{display:none}
.art{width:100%;height:auto;display:block}
.main{flex:1;min-width:0}
.panel h3{font-size:3cqw;margin:0 0 1cqw;color:var(--tx)}
.panel p,.panel li{font-size:2.2cqw;line-height:1.35;margin:.6cqw 0}
.panel ul{padding-left:2.4cqw;margin:0}
.panel table{width:100%;border-collapse:collapse;font-size:1.9cqw}
.panel th{background:var(--c);color:#2e2140;padding:.7cqw 1cqw;text-align:left}
.panel td{padding:.7cqw 1cqw;border-bottom:.2cqw solid #f0cfe0;vertical-align:top}
.panel .ov{overflow:visible}
.key{font-weight:700;color:var(--tx)}
.lesson{margin-top:1cqw;padding:.9cqw 1.4cqw;border-radius:1.2cqw;background:var(--c);color:#2e2140;font-weight:700;font-size:2.1cqw}
.next{display:flex;justify-content:space-between;margin-top:1.2cqw}
.next button{border:.25cqw solid var(--bd);background:var(--c);color:#2e2140;border-radius:99px;padding:.9cqw 3cqw;font:inherit;font-weight:700;font-size:2cqw;cursor:pointer}
@keyframes fl{50%{transform:translateY(-.8cqw) rotate(4deg)}}
@keyframes bn{50%{transform:translateY(-.6cqw) scale(1.05)}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
</style></head><body>
<div class="stage" id="app"></div>
<script>
var P=function(t){return '<p>'+t+'</p>'},U=function(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'},
TB=function(h,r){return '<div class="ov"><table><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+r.map(function(y){return '<tr>'+y.map(function(x){return '<td>'+x+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'},
L=function(t){return '<div class="lesson">'+t+'</div>'};
var T=[
{id:'i1',short:'Cambio',tema:'¿Qué es el cambio?',e:'🧭',c:'#ffb98a',subs:[
['','Gestión del cambio empresarial',U(['Camila Agudelo','Cristhy Carrascal','Yaira Garcia','Soleiny Garcia','Danna Martinez'])],
['🎯','¿Qué es el cambio empresarial?',P('Es <span class="key">modificar uno o varios elementos</span> de una organización:')+U(['Estrategia y estructura','Procesos y tecnología','Cultura y personas'])],
['🧭','¿Qué es gestionar el cambio?',P('Es <span class="key">llevar a la empresa de donde está a donde quiere estar</span>, cuidando a las personas y logrando que el cambio se mantenga en el tiempo.')+P('Según Hiatt, el resultado depende de lo que cada persona haga de manera diferente.')],
['🔀','Clasificación de los cambios',TB(['Según su origen','Según su profundidad'],[['<b>Planeado:</b> lo decide la dirección a tiempo.<br><br><b>Emergente:</b> llega por una crisis, un competidor o una norma.','<b>Incremental:</b> ajustes pequeños y graduales.<br><br><b>Radical:</b> cambia de fondo la estrategia, la estructura o la cultura.']])],
['🌍','¿Por qué cambian las empresas?',TB(['Causas externas','Causas internas'],[['Tecnología<br>Mercado<br>Competencia<br>Regulación<br>Crisis','Bajo desempeño<br>Nuevos líderes<br>Fusiones<br>Reducir costos']])]]},
{id:'i2',short:'Modelos',tema:'Tres modelos',e:'🧊',c:'#9ccbf5',subs:[
['🧊','Modelo de Lewin',P('Tres etapas, como un cubo de hielo:')+TB(['Etapa','Qué se hace'],[['<b>1. Descongelar</b>','Entender que la forma anterior ya no sirve'],['<b>2. Cambiar</b>','Implementar lo nuevo y acompañar a las personas'],['<b>3. Recongelar</b>','Consolidar con políticas, incentivos y cultura']])+P('Es el más sencillo y la base de los demás.')],
['🪜','Modelo de Kotter',TB(['Bloque','Pasos'],[['<b>Crear el ambiente</b>','1 Urgencia · 2 Coalición de líderes'],['<b>Mover a la gente</b>','3 Visión · 4 Comunicarla · 5 Quitar obstáculos'],['<b>Hacer que dure</b>','6 Victorias rápidas · 7 Consolidar · 8 Anclar en la cultura']])+L('Muchos cambios fracasan por saltarse pasos o cantar victoria muy pronto.')],
['🔤','Modelo ADKAR',P('Mira el cambio <span class="key">persona por persona</span>:')+TB(['Letra','Elemento','Pregunta'],[['<b>A</b>','Conciencia','¿Entiendo por qué hay que cambiar?'],['<b>D</b>','Deseo','¿Quiero participar?'],['<b>K</b>','Conocimiento','¿Sé cómo cambiar?'],['<b>A</b>','Habilidad','¿Puedo hacerlo en la práctica?'],['<b>R</b>','Refuerzo','¿Qué me ayuda a mantenerlo?']])],
['⚖️','Comparación',TB(['Modelo','Aporta'],[['Lewin','La lógica general del proceso'],['Kotter','Cómo dirigirlo desde arriba'],['ADKAR','Cómo lo vive cada persona']])+L('No compiten: se complementan.')]]},
{id:'i3',short:'Resistencia',tema:'Resistencia al cambio',e:'🧱',c:'#f5a9c4',subs:[
['🧱','¿Qué es la resistencia?',P('Es la <span class="key">oposición, abierta o silenciosa</span>, frente a una transformación.')+P('Es una reacción natural, no siempre mala voluntad.')+P('Ejemplo: el profesor cambia la forma de evaluar sin explicar por qué.')],
['😰','Las 4 causas',TB(['Causa','Qué pasa'],[['<b>Perder</b>','Miedo a perder seguridad, poder, estatus o beneficios'],['<b>No entender</b>','Malentendidos o falta de información'],['<b>No estar de acuerdo</b>','Creen que no tiene sentido para la empresa'],['<b>No tolerar</b>','Poca tolerancia a lo nuevo']])+P('Se suman la costumbre y la desconfianza por cambios fallidos antes.')],
['🛠️','Las 6 estrategias',TB(['Estrategia','En qué consiste'],[['<b>1. Educación y comunicación</b> ✅','Explicar el porqué antes de cambiar'],['<b>2. Participación</b> ✅','Dejar que den ideas'],['<b>3. Apoyo</b> ✅','Capacitación y acompañamiento'],['<b>4. Negociación</b>','Incentivos a quienes salen afectados'],['<b>5. Manipulación</b>','Información parcial: daña la confianza'],['<b>6. Coerción</b>','Presión: último recurso']])]]},
{id:'i4',short:'Liderazgo',tema:'Liderazgo y comunicación',e:'🧑‍✈️',c:'#9fdcae',subs:[
['⚖️','Administrar vs. liderar',TB(['Administrar','Liderar'],[['Controlar tareas, horarios y procesos','Construir una visión, alinear y motivar']])+L('Un cambio necesita liderazgo, no solo administración (Kotter).')],
['🧑‍✈️','Funciones del líder',TB(['Función','Idea'],[['<b>Dar el ejemplo</b>','Decir y hacer lo mismo'],['<b>Equipo de apoyo</b>','Aliados en distintos niveles'],['<b>Escuchar</b>','Atender la resistencia'],['<b>Reconocer avances</b>','Las pequeñas victorias motivan']])],
['📣','Comunicación del cambio',TB(['Debe ser','Significa'],[['<b>Clara y simple</b>','Todos pueden explicar la visión en pocas palabras'],['<b>Repetida</b>','Un solo anuncio no basta'],['<b>Bidireccional</b>','Informar, escuchar y responder dudas'],['<b>Honesta</b>','También sobre dificultades y riesgos']])]]},
{id:'i5',short:'Casos',tema:'Casos y cierre',e:'🏁',c:'#c3b2f5',subs:[
['📷','Kodak',P('<b>1975:</b> su ingeniero Steven Sasson crea la primera cámara digital.')+P('La empresa tardó en transformar su negocio de película.')+P('<b>2012:</b> se acoge al Capítulo 11.')+L('La resistencia también puede venir de la dirección.')],
['📱','Nokia',P('Líder mundial que perdió terreno frente a Apple y Android.')+P('<b>2011:</b> memorando de la “plataforma en llamas” y alianza con Microsoft.')+P('<b>2014:</b> se completa la venta de su división móvil a Microsoft.')+L('La urgencia no basta si el cambio llega tarde.')],
['🎬','Netflix',P('<b>1998:</b> alquiler de DVD por correo.')+P('<b>2007:</b> lanza el streaming.')+P('<b>2013:</b> empieza a producir contenido propio.')+L('Cambiar antes de que te obliguen.')],
['📊','Comparación de casos',TB(['Empresa','Tipo de cambio','Resultado'],[['Kodak','Reactivo y tardío','Capítulo 11 (2012)'],['Nokia','Reactivo y urgente','Venta a Microsoft (2014)'],['Netflix','Planeado y anticipado','Líder en streaming']])],
['🏁','Conclusiones',U(['<b>Anticiparse</b> es mejor que reaccionar','El cambio depende de las <b>personas</b>, no solo de la tecnología','Se necesitan <b>líderes coherentes</b> y comunicación constante'])+P('Recomendación: mirar el entorno con frecuencia e involucrar a la gente desde el inicio.')],
['🎮','¡A jugar!',P('Ahora los invitamos a poner a prueba lo aprendido con una actividad.')]]}
];
var seen={},cur=0,goLast=false,app=document.getElementById('app');
var ICE='<svg class="art" viewBox="0 0 340 100"><rect x="8" y="18" width="62" height="62" rx="12" fill="#bfe3fb" stroke="#6bb3e8" stroke-width="3"/><text x="39" y="54" text-anchor="middle" font-size="14" fill="currentColor">hielo</text><path d="M84 50h36m-10-9l10 9-10 9" fill="none" stroke="#999" stroke-width="3" stroke-linecap="round"/><path d="M170 12c16 24 26 36 26 50a26 26 0 0 1-52 0c0-14 10-26 26-50z" fill="#a8d8f7" stroke="#6bb3e8" stroke-width="3"/><text x="170" y="68" text-anchor="middle" font-size="14" fill="currentColor">agua</text><path d="M214 50h36m-10-9l10 9-10 9" fill="none" stroke="#999" stroke-width="3" stroke-linecap="round"/><rect x="268" y="20" width="62" height="58" rx="6" transform="rotate(8 299 49)" fill="#d7ccf7" stroke="#9a86e0" stroke-width="3"/><text x="299" y="54" text-anchor="middle" font-size="14" fill="currentColor">nuevo</text></svg>';
var STAIRS=(function(){var s='<svg class="art" viewBox="0 -14 340 134">';for(var i=0;i<8;i++){var hh=12*(i+1),x=8+i*41;s+='<rect x="'+x+'" y="'+(100-hh)+'" width="38" height="'+hh+'" rx="5" fill="hsl('+(200+i*20)+',75%,84%)" stroke="#8a8aa8" stroke-width="2"/><text x="'+(x+19)+'" y="'+(94-hh)+'" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">'+(i+1)+'</text>'}return s+'</svg>'})();
var ROAD='<svg class="art" viewBox="0 0 340 100"><rect x="10" y="30" width="70" height="44" rx="12" fill="#ffd9bf" stroke="#f0a070" stroke-width="3"/><text x="45" y="58" text-anchor="middle" font-size="15" fill="currentColor">Hoy</text><path d="M85 52h140" stroke="#999" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><path d="M222 40l16 12-16 12" fill="none" stroke="#999" stroke-width="5" stroke-linecap="round"/><rect x="258" y="30" width="72" height="44" rx="12" fill="#d3f3dc" stroke="#7cc995" stroke-width="3"/><text x="294" y="58" text-anchor="middle" font-size="15" fill="currentColor">Meta</text></svg>';
var ADK=(function(){var s='<svg class="art" viewBox="0 0 340 100"><path d="M34 50H306" stroke="#bbb" stroke-width="4"/>';'ADKAR'.split('').forEach(function(l,i){s+='<circle cx="'+(34+68*i)+'" cy="50" r="28" fill="hsl('+(i*60)+',80%,85%)" stroke="#8a8aa8" stroke-width="3"/><text x="'+(34+68*i)+'" y="60" text-anchor="middle" font-size="28" font-weight="800" fill="currentColor">'+l+'</text>'});return s+'</svg>'})();
var CAM='<svg class="art" viewBox="0 0 340 100"><rect x="100" y="25" width="140" height="62" rx="12" fill="#ffe3a3" stroke="#e0b44a" stroke-width="3"/><rect x="125" y="14" width="40" height="16" rx="5" fill="#ffe3a3" stroke="#e0b44a" stroke-width="3"/><circle cx="170" cy="56" r="22" fill="#fff" stroke="#e0b44a" stroke-width="3"/><circle cx="170" cy="56" r="11" fill="#9ccbf5"/><circle cx="222" cy="40" r="5" fill="#e0b44a"/></svg>';
var PHN='<svg class="art" viewBox="0 0 340 100"><rect x="140" y="4" width="60" height="92" rx="10" fill="#d7ccf7" stroke="#9a86e0" stroke-width="3"/><rect x="148" y="14" width="44" height="60" rx="4" fill="#fff"/><path d="M170 24c10 12 14 18 14 26a14 14 0 0 1-28 0c0-6 4-10 8-14 0 6 4 8 6 8-2-8-2-12 0-20z" fill="#ffb98a" stroke="#f0a070" stroke-width="2"/><circle cx="170" cy="86" r="4" fill="#9a86e0"/></svg>';
var TV='<svg class="art" viewBox="0 0 340 100"><rect x="90" y="6" width="160" height="76" rx="10" fill="#f5a9c4" stroke="#e07a9f" stroke-width="3"/><rect x="100" y="16" width="140" height="56" rx="6" fill="#fff"/><path d="M160 28l36 16-36 16z" fill="#f5a9c4" stroke="#e07a9f" stroke-width="2" stroke-linejoin="round"/><path d="M135 92h70" stroke="#e07a9f" stroke-width="5" stroke-linecap="round"/></svg>';
var WALL=(function(){var s='<svg class="art" viewBox="0 0 340 100">';for(var r=0;r<3;r++)for(var c=0;c<6;c++){var x=10+c*64-(r%2?32:0);s+='<rect x="'+x+'" y="'+(8+r*30)+'" width="60" height="26" rx="4" fill="hsl('+(340+c*6)+',70%,86%)" stroke="#d98aa8" stroke-width="2"/>'}return s+'</svg>'})();
var CHAT='<svg class="art" viewBox="0 0 340 100"><rect x="15" y="8" width="150" height="40" rx="18" fill="#9fdcae" stroke="#6cbf86" stroke-width="3"/><text x="90" y="34" text-anchor="middle" font-size="15" fill="currentColor">informar</text><rect x="175" y="52" width="150" height="40" rx="18" fill="#9ccbf5" stroke="#6bb3e8" stroke-width="3"/><text x="250" y="78" text-anchor="middle" font-size="15" fill="currentColor">escuchar</text></svg>';
function art(t){return /Lewin/.test(t)?ICE:/Kotter/.test(t)?STAIRS:/ADKAR/.test(t)?ADK:/gestionar/.test(t)?ROAD:/Kodak/.test(t)?CAM:/Nokia/.test(t)?PHN:/Netflix/.test(t)?TV:/resistencia/.test(t)?WALL:/Comunicaci/.test(t)?CHAT:''}
function hub(){
 var h='<h1>🌀 Gestión del cambio empresarial</h1><p class="sub">Toca una casilla · teclas 1 a 5 y flechas ← →</p><div class="grid">';
 T.forEach(function(s){h+='<button class="card" style="--c:'+s.c+'" data-go="'+s.id+'">'+(seen[s.id]?'<i>✓</i>':'')+'<span class="e">'+s.e+'</span><b>'+s.tema+'</b></button>'});
 h+='</div><div class="foot">Fundamentos de Administración y Gerencia · Universidad Simón Bolívar</div>';
 ['🌟','🎈','✨','🌈','💡','🦋'].forEach(function(e,i){h+='<span class="deco" style="top:'+(1+i*3)+'cqw;'+(i%2?'right':'left')+':'+(1+i*2)+'cqw">'+e+'</span>'});
 app.innerHTML=h;
}
function screen(s,k){
 seen[s.id]=1;
 var h='<div style="--c:'+s.c+'"><div class="nav"><button data-go="" style="--c:#cfd4dc">🗺️ Mapa</button>';
 T.forEach(function(x,j){h+='<button data-go="'+x.id+'" style="--c:'+x.c+'"'+(x===s?' class="on"':'')+'>'+x.e+' '+x.short+'</button>'});
 h+='</div><div class="bar"><h2>'+s.e+' '+s.tema+'</h2></div><div class="chips">';
 s.subs.forEach(function(it,i){h+='<button class="chip" data-i="'+i+'">'+it[0]+' '+it[1]+'</button>'});
 h+='</div><div class="panel" id="p"></div><div class="next"><button id="pv">← Anterior</button><button id="nx">Siguiente →</button></div></div>';
 app.innerHTML=h;
 var chs=app.querySelectorAll('.chip');
 chs.forEach(function(b){b.onclick=function(){
  chs.forEach(function(x){x.classList.remove('on')});b.classList.add('on');cur=+b.dataset.i;
  var it=s.subs[cur];
  document.getElementById('p').innerHTML=((it[0]||art(it[1]))?'<div class="side"><div class="big">'+it[0]+'</div>'+art(it[1])+'</div>':'')+'<div class="main"><h3>'+it[1]+'</h3>'+it[2]+'</div>';
 }});
 chs[goLast?chs.length-1:0].click();goLast=false;
 var n=T.indexOf(s);
 document.getElementById('nx').onclick=function(){if(cur<s.subs.length-1)chs[cur+1].click();else location.hash=T[n+1]?T[n+1].id:'mapa'};
 document.getElementById('pv').onclick=function(){if(cur>0)chs[cur-1].click();else if(T[n-1]){goLast=true;location.hash=T[n-1].id}else location.hash='mapa'};
}
function route(){
 var id=location.hash.slice(1),s=T.filter(function(x){return x.id===id})[0];
 if(s)screen(s);else hub();
 window.scrollTo(0,0);
}
app.addEventListener('click',function(e){
 var t=e.target.closest('[data-go]');if(t){var g=t.getAttribute('data-go');location.hash=g||'mapa'}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'||e.key==='0'){location.hash='mapa';return}
 if(e.key==='ArrowRight'){var x=document.getElementById('nx');if(x)x.click();return}
 if(e.key==='ArrowLeft'){var y=document.getElementById('pv');if(y)y.click();return}
 var s=T[+e.key-1];if(s)location.hash=s.id;
});
window.addEventListener('hashchange',route);
route();
</script></body></html>
